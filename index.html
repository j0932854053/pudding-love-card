<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布丁幸福集點卡 ♡</title><style>body{margin:0;background:#fff7e7;color:#68482f;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:520px;margin:auto;padding:32px 18px;text-align:center}.card{background:white;border:2px solid #f2dbad;border-radius:25px;padding:24px;box-shadow:0 6px 0 #f8e7c7}.dog{font-size:76px}.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:25px 0}.dot{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#fff0d4;border:2px dashed #e4cba5}.on{background:#ffd35d;border:2px solid #d8a545}.history{text-align:left;font-size:14px;padding:8px;border-bottom:1px solid #f0e4d2}.small{color:#9d8061;font-size:12px}</style></head><body><div class="wrap"><div class="dog">🐶🍮</div><h1>布丁幸福集點卡 ♡</h1><p>每一個小小的進步，都值得被喜歡。</p><div class="card"><h2 id="count"></h2><div id="dots" class="dots"></div><h3 id="prize"></h3><p id="status"></p><div class="small" id="updated"></div></div><section id="sharedHistory" hidden><h3>幸福紀錄 ⭐</h3><div id="history"></div></section><p class="small">這是唯讀集點卡，由男友手動同步更新 ♡</p></div><script>const d={"goal":10,"prize":"男友請吃一頓浪漫晚餐 🍮","points":0,"round":1,"history":[],"updated":""};const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('count').textContent='第 '+d.round+' 輪｜'+d.points+' / '+d.goal+' 點';document.getElementById('dots').innerHTML=Array.from({length:d.goal},(_,i)=>'<div class="dot '+(i<d.points?'on':'')+'">'+(i<d.points?'⭐':i+1)+'</div>').join('');document.getElementById('prize').textContent='🎁 '+d.prize;document.getElementById('status').textContent=d.points>=d.goal?'🎉 集滿啦！可以兌換獎勵！':'再集 '+(d.goal-d.points)+' 點就能換獎品';document.getElementById('updated').textContent='尚未同步';document.getElementById('sharedHistory').hidden = d.history.length === 0;document.getElementById('history').innerHTML=d.history.slice().reverse().map(x=>'<div class="history">'+e(x.type==='point'?'⭐ '+x.reason:'🎁 已兌換：'+x.reason)+'<div class="small">'+e(x.time)+'</div></div>').join('')||'還沒有紀錄';</script></body></html>
